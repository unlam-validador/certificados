  <script>
    (function () {
      function limpiarError(grupo) {
        if (!grupo) return;
        grupo.className = grupo.className.replace(/\berror\b/g, '').replace(/\s+/g, ' ').trim();
        var anteriores = grupo.querySelectorAll('.help-block.validacion-local');
        for (var i = 0; i < anteriores.length; i++) anteriores[i].parentNode.removeChild(anteriores[i]);
      }

      function marcarError(grupo, mensaje) {
        if (!grupo) return;
        if (!/\berror\b/.test(grupo.className)) grupo.className += ' error';
        var controls = grupo.querySelector('.controls') || grupo;
        var aviso = document.createElement('span');
        aviso.className = 'help-block validacion-local';
        aviso.appendChild(document.createTextNode(mensaje));
        controls.appendChild(aviso);
      }

      document.addEventListener('submit', function (e) {
        var form = e.target;
        if (!form || form.id !== 'guarani_form_validar') return;
        e.preventDefault();
        e.stopImmediatePropagation();

        var documento = document.getElementById('documento');
        var codigo = document.getElementById('codigo_valid');
        var grupoDocumento = document.getElementById('control_group_documento');
        var grupoCodigo = document.getElementById('control_group_codigo_valid');

        limpiarError(grupoDocumento);
        limpiarError(grupoCodigo);

        var faltaDocumento = !documento || documento.value.replace(/^\s+|\s+$/g, '') === '';
        var faltaCodigo = !codigo || codigo.value.replace(/^\s+|\s+$/g, '') === '';

        if (faltaDocumento) marcarError(grupoDocumento, 'Debe ingresar el documento.');
        if (faltaCodigo) marcarError(grupoCodigo, 'Debe ingresar el código de validación.');

        if (faltaDocumento || faltaCodigo) {
          if (faltaDocumento && documento) documento.focus();
          else if (faltaCodigo && codigo) codigo.focus();
          return false;
        }

        var contenedor = document.getElementById('validador');
        if (!contenedor) return false;
        contenedor.innerHTML =
          '<div class="hero-unit">' +
            '<h1>Certificado Válido</h1>' +
            '<div id="descripcion" class="alert alert-block alert-success">Certificado es válido y está vigente.</div>' +
            '<p><a href="#" id="volver_local" class="btn btn-primary btn-large">Volver</a></p>' +
          '</div>';
        window.scrollTo(0, 0);
        return false;
      }, true);

      document.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'volver_local') {
          e.preventDefault();
          window.location.reload();
        }
      }, true);
    })();
  </script>
</body>
</html>
